<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />

    <title>Island-Wide Virtual Premier League — Virtual Premier League Competition, Base Singapore</title>
    <meta
      name="description"
      content="The Island-Wide Virtual Premier League (IWVPL) is your home for top-tier EA FC competitive action across Southeast Asia. Pro Clubs, 1v1 FUT and Champions League tournaments."
    />
    <meta name="author" content="Island-Wide Virtual Premier League" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Island-Wide Virtual Premier League" />
    <meta property="og:title" content="Island-Wide Virtual Premier League" />
    <meta
      property="og:description"
      content="Forging Virtual Football Champions. Top-tier EA FC competitive action across Southeast Asia."
    />
    <meta property="og:image" content="/assets/brand/hero-stadium.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/brand/iwvpl-wordmark.png" />

    <script>
      // Resolve dark/light before first paint to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var saved = localStorage.getItem('iwvpl-theme')
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          var el = document.documentElement
          el.classList.remove('dark', 'light')
          el.classList.add(theme)
          el.style.colorScheme = theme
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', theme === 'dark' ? '#0a0b0d' : '#f6f7f4')
        } catch (e) {}
      })()
    </script>

    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-latin-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/sora-latin-600.woff2" crossorigin />
    <!-- Slide 1 is the LCP element on the home page, and it is now the same
         file at every width, so one unconditional preload replaces the old
         desktop/mobile pair. -->
    <link rel="preload" as="image" href="/assets/hero/slide-1.webp" fetchpriority="high" />

    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
